<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 to MP4 Browser Converter</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border: 1px dashed #475569; border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Audio to Video Converter</h2>
    <div class="input-group">
        <label>1. Select MP3 Audio</label>
        <input type="file" id="audioFile" accept=".mp3">
    </div>
    <div class="input-group">
        <label>2. Select Background Image</label>
        <input type="file" id="imageFile" accept="image/*">
    </div>
    <button id="convertBtn">Convert Locally</button>
    <p id="status">Ready to convert</p>
</div>

<script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile } = FFmpegUtil;
    let ffmpeg = null;

    async function loadFFmpeg() {
        if (ffmpeg) return;
        document.getElementById('status').innerText = 'Loading conversion engine...';
        ffmpeg = new FFmpeg();
        
        ffmpeg.on('log', ({ message }) => {
            console.log(message);
        });

        // Load core webassembly package
        await ffmpeg.load({
            coreURL: "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js",
            wasmURL: "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm",
        });
        document.getElementById('status').innerText = 'Engine ready!';
    }

    document.getElementById('convertBtn').addEventListener('click', async () => {
        const audioInput = document.getElementById('audioFile').files[0];
        const imageInput = document.getElementById('imageFile').files[0];

        if (!audioInput || !imageInput) {
            alert('Please select both an MP3 and an image file!');
            return;
        }

        try {
            await loadFFmpeg();
            document.getElementById('status').innerText = 'Processing files...';

            // Write files to memory virtual file system
            await ffmpeg.writeFile('input.mp3', await fetchFile(audioInput));
            await ffmpeg.writeFile('input.jpg', await fetchFile(imageInput));

            document.getElementById('status').innerText = 'Rendering MP4 video...';
            
            // Run FFmpeg command entirely in browser memory
            await ffmpeg.exec([
                '-loop', '1', 
                '-i', 'input.jpg', 
                '-i', 'input.mp3', 
                '-c:v', 'libx264', 
                '-tune', 'stillimage', 
                '-c:a', 'aac', 
                '-b:a', '192k', 
                '-pix_fmt', 'yuv420p', 
                '-shortest', 
                'output.mp4'
            ]);

            document.getElementById('status').innerText = 'Done! Downloading file...';
            
            // Read output data
            const data = await ffmpeg.readFile('output.mp4');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            // Trigger auto-download
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = 'converted-video.mp4';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            document.getElementById('status').innerText = 'Success! Check your downloads.';
        } catch (error) {
            console.log(error);
            document.getElementById('status').innerText = 'Error during conversion.';
        }
    });
</script>

</body>
</html>
