<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 to MP4 Mobile Converter</title>
    <!-- Fully qualified CDN URL for single-threaded ffmpeg.wasm v0.10.15 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.15/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; font-size: 22px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="file"] { width: 100%; padding: 12px; background: #0f172a; border: 1px dashed #475569; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 15px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:active { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }
        #status { margin-top: 20px; text-align: center; font-size: 13px; color: #cbd5e1; word-break: break-word; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; font-family: monospace; max-height: 120px; overflow-y: auto; }
        .success { border-color: #22c55e !important; color: #86efac !important; }
        .error { border-color: #ef4444 !important; color: #fca5a5 !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>MP3 to MP4</h2>
    <div class="input-group">
        <label>1. Select Audio (MP3)</label>
        <input type="file" id="audioFile" accept="audio/*">
    </div>
    <div class="input-group">
        <label>2. Select Image (JPG/PNG)</label>
        <input type="file" id="imageFile" accept="image/*">
    </div>
    <button id="convertBtn">Convert Locally</button>
    <div id="status">Ready. Select files to begin.</div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;

    const statusDiv = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');

    function log(message, type = 'info') {
        statusDiv.innerText = message;
        statusDiv.className = type;
        console.log(message);
    }

    convertBtn.addEventListener('click', async () => {
        const audioInput = document.getElementById('audioFile').files[0];
        const imageInput = document.getElementById('imageFile').files[0];

        if (!audioInput || !imageInput) {
            log('Error: Please select both an audio file and an image file.', 'error');
            return;
        }

        convertBtn.disabled = true;

        try {
            if (!ffmpeg) {
                log('Loading converter engine (approx. 20mb)...');
                ffmpeg = createFFmpeg({ 
                    log: true,
                    corePath: 'https://unpkg.com/@ffmpeg/core@0.10.0/dist/ffmpeg-core.js'
                });
                await ffmpeg.load();
            }

            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            log('Reading files...');
            const audioName = 'input_audio.mp3';
            const imageName = 'input_image.jpg';
            
            ffmpeg.FS('writeFile', audioName, await fetchFile(audioInput));
            ffmpeg.FS('writeFile', imageName, await fetchFile(imageInput));

            log('Converting... Please keep screen on.');
            
            await ffmpeg.run(
                '-loop', '1',
                '-i', imageName,
                '-i', audioName,
                '-c:v', 'libx264',
                '-tune', 'stillimage',
                '-c:a', 'aac',
                '-b:a', '192k',
                '-pix_fmt', 'yuv420p',
                '-shortest',
                'output.mp4'
            );

            log('Conversion complete! Preparing download...');
            const data = ffmpeg.FS('readFile', 'output.mp4');

            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = `video_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                try {
                    ffmpeg.FS('unlink', audioName);
                    ffmpeg.FS('unlink', imageName);
                    ffmpeg.FS('unlink', 'output.mp4');
                } catch(e) {}
            }, 1000);

            log('Success! File downloaded.', 'success');

        } catch (error) {
            console.error(error);
            log(`Error: ${error.message || error}`, 'error');
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
